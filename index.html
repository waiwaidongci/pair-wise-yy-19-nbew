<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岩芯薄片显微样本编目与鉴定放行台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <header class="mast">
      <div>
        <p>Core Thin-Section Release Desk</p>
        <h1>岩芯薄片显微样本编目与鉴定放行台</h1>
      </div>
      <div id="overviewChips" class="chips"></div>
    </header>

    <p id="banner" class="banner" hidden></p>

    <section class="layout">
      <div class="col-forms">
        <form id="catalogForm" class="panel">
          <h2>编目录入</h2>
          <label>收纳箱号<input name="boxNo" placeholder="BX-01"></label>
          <label>样本编号<input name="sampleNo" placeholder="YP-2026-001"></label>
          <div class="pair">
            <label>深度（m）<input name="depth" placeholder="125.4"></label>
            <label>日期<input name="date" type="date"></label>
          </div>
          <p class="hint">编号、深度或日期空白即停补录；每个收纳箱最多一张在途单据。</p>
          <button type="submit">落单编目</button>
        </form>

        <form id="identForm" class="panel">
          <h2 id="identFormTitle">鉴定录入</h2>
          <label>单据<select id="identDoc" name="docId"></select></label>
          <label>矿物组成<input name="minerals" placeholder="石英、斜长石、黑云母"></label>
          <label>结构<input name="texture" placeholder="半自形粒状结构"></label>
          <div class="pair">
            <label>偏光
              <select name="polarization">
                <option value="">缺失</option>
                <option>单偏光</option>
                <option>正交偏光</option>
                <option>锥光</option>
                <option>反射光</option>
              </select>
            </label>
            <label>孔隙占比（%）<input name="porosity" type="number" min="0" max="100" step="0.1" placeholder="12.5"></label>
          </div>
          <label>鉴定者<input name="identifier" placeholder="张工"></label>
          <p class="hint">孔隙越过 20% 或偏光缺失只进复查；复查者须与首次鉴定者不同。</p>
          <button id="identSubmit" type="submit">提交鉴定</button>
        </form>
      </div>

      <div class="col-board">
        <section class="panel">
          <h2>单据总览</h2>
          <div id="docList" class="doc-list"></div>
        </section>
        <section class="panel">
          <h2>复查队列</h2>
          <div id="reviewQueue" class="queue-list"></div>
        </section>
      </div>

      <aside class="panel col-history">
        <h2>履历</h2>
        <div id="historyPane"></div>
      </aside>
    </section>
  </main>

  <script src="./js/judgment.js"></script>
  <script src="./js/intake.js"></script>
  <script src="./js/store.js"></script>
  <script src="./app.js"></script>
</body>
</html>
